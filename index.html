<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>互盛-114年共同供應契約型錄</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    :root {
      --huxen-blue: #005bac;
      --huxen-blue-hover: #004b8e;
      --huxen-dark: #0a1f3d;
      --huxen-navy: #102a54;
      --huxen-light: #eef3f9;
      --desk: #e2e7ef;
      --ink: #1e293b;
      --ink-soft: #475569;
      --ink-faint: #8a9bb0;
      --hairline: rgba(16, 42, 84, 0.12);
      --brass-1: #d9bd82;
      --brass-2: #8a6c38;
      --shadow-color: rgba(10, 31, 61, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--desk);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.8) 0%, transparent 70%),
        linear-gradient(135deg, #d8dee8 0%, #e9eef5 50%, #d4dbe6 100%);
      z-index: -1;
      pointer-events: none;
    }

    /* ---------------- Header Navbar ---------------- */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(10, 31, 61, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .logo-icon {
      background: #005bac;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 4px 9px;
      border-radius: 5px;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .catalog-title {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
    }
    .catalog-sub {
      font-size: 11px;
      font-weight: 400;
      color: #94a3b8;
      letter-spacing: 0.6px;
    }

    /* View Mode Segmented Control */
    .mode-segmented {
      display: inline-flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      gap: 3px;
    }
    .seg-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 13px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .seg-btn:hover:not(.active) {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }
    .seg-btn.active {
      background: #005bac;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 91, 172, 0.55);
    }
    .seg-icon { font-size: 14px; }
    .header-center {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: center;
      max-width: 860px;
      margin: 0 16px;
    }

    .header-search {
      position: relative;
      flex: 1;
      max-width: 320px;
      margin: 0;
    }

    .search-input {
      width: 100%;
      height: 34px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 17px;
      padding: 0 14px 0 36px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input::placeholder { color: #94a3b8; }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.22);
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      fill: none;
      stroke: #94a3b8;
      stroke-width: 2;
    }

    .search-results {
      position: absolute;
      top: 42px;
      left: 0; right: 0;
      background: #ffffff;
      color: #0f172a;
      border-radius: 10px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.25);
      max-height: 380px;
      overflow-y: auto;
      display: none;
      z-index: 200;
      border: 1px solid #cbd5e1;
    }
    .search-results.open { display: block; }
    .search-item {
      padding: 9px 12px;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .search-item:hover { background: #f0f7ff; }
    .search-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-item-title {
      font-weight: 600;
      font-size: 12.5px;
      color: #0284c7;
    }
    .search-item-page {
      font-size: 11px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .search-item-snippet {
      font-size: 11.5px;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      height: 32px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .nav-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* ---------------- Prominent Quick Guide Banner (醒目操作說明列) ---------------- */
    .quick-guide-bar {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 31, 61, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.38);
      border-radius: 28px;
      padding: 6px 20px;
      color: #e2e8f0;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 92;
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.32);
      white-space: nowrap;
      transition: opacity 0.3s;
    }
    .guide-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .guide-item strong {
      color: #38bdf8;
      font-weight: 600;
    }
    .guide-badge {
      background: #005bac;
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 700;
    }
    .guide-sep {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.2);
    }

    /* ---------------- Main Viewport ---------------- */
    .main-viewport {
      position: absolute;
      top: 56px;
      bottom: 56px;
      left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ---------------- Double Page (3D Mode) ---------------- */
    .view-mode-spread {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .sb-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .sb-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* 3D Book Container (平滑寬度過渡，支援單面封面) */
    .sb-3d {
      position: relative;
      width: min(92vw, calc((100vh - 124px) * 1.4139));
      aspect-ratio: 1906 / 1348;
      perspective: 2200px;
      transform-style: preserve-3d;
      will-change: transform, width, aspect-ratio;
      transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1), aspect-ratio 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 首頁單面封面模式 (無左側假藍色頁面，居中完美呈現單頁封面) */
    .sb-3d.is-cover {
      width: min(46vw, calc((100vh - 124px) * 0.707)) !important;
      aspect-ratio: 953 / 1348 !important;
    }

    .sb-3d.is-cover .arrow-btn.left {
      display: none !important;
    }

    .sb-3d.is-cover .arrow-btn.right {
      right: -26px;
    }

    .sb-3d.is-cover .sb-book {
      border-left: 4px solid #0a1f3d;
      border-radius: 4px 8px 8px 4px;
      box-shadow:
        -8px 0 20px rgba(0, 0, 0, 0.28),
        10px 14px 40px rgba(10, 31, 61, 0.32);
    }

    .sb-3d.is-cover .sb-full img {
      border-radius: 2px 6px 6px 2px;
    }

    .sb-tilt {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--zoom, 1)) translate3d(var(--pan-x, 0px), var(--pan-y, 0px), 0);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    /* Layered Cast Shadows */
    .sb-cast {
      position: absolute;
      pointer-events: none;
      border-radius: 8px;
    }
    .sb-cast.ambient {
      inset: 2% 2%;
      box-shadow: 0 30px 60px rgba(16, 42, 84, 0.28);
    }
    .sb-cast.contact {
      inset: 1% 1%;
      box-shadow: 0 10px 20px rgba(16, 42, 84, 0.35);
    }
    .sb-cast.hair {
      inset: 0.5% 0.5%;
      box-shadow: 0 2px 4px rgba(16, 42, 84, 0.45);
    }

    .sb-book {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      border-radius: 4px;
      overflow: visible;
      will-change: transform;
    }

    /* Idle Spread */
    .sb-full {
      position: absolute;
      inset: 0;
    }
    .sb-full img {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 4px;
    }

    /* Halves during turning */
    .sb-half {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      overflow: hidden;
    }
    .sb-half.left { left: 0; }
    .sb-half.right { left: 50%; }
    .sb-half-img {
      position: absolute;
      top: 0; height: 100%;
      width: 200%;
      max-width: none;
      display: block;
    }
    .sb-half-img.left { left: 0; }
    .sb-half-img.right { margin-left: -100%; }

    .gutter-shade {
      position: absolute;
      top: 0; bottom: 0; width: 50px;
      pointer-events: none;
      z-index: 5;
      opacity: calc(var(--shade, 0) * 0.7);
    }
    .gutter-shade.left {
      right: 0;
      background: linear-gradient(270deg, rgba(16, 42, 84, 0.32), transparent);
    }
    .gutter-shade.right {
      left: 0;
      background: linear-gradient(90deg, rgba(16, 42, 84, 0.28), transparent);
    }

    /* ---------------- The 18-Strip 3D Chain ---------------- */
    .curl {
      position: absolute;
      top: 0; height: 100%;
      width: calc(var(--bw, 0px) * var(--span, 0.5));
      transform-style: preserve-3d;
      z-index: 40;
    }
    .curl.next {
      left: 50%;
      transform-origin: left center;
      transform: rotateY(calc(-1 * var(--tt, 0deg)));
    }
    .curl.prev {
      right: 50%;
      transform-origin: right center;
      transform: rotateY(var(--tt, 0deg));
    }

    .strip {
      position: absolute;
      top: 0; height: 100%;
      width: calc(var(--bw, 0px) * var(--span, 0.5) / var(--n, 18));
      transform-style: preserve-3d;
    }
    .curl.next .strip { transform-origin: left center; }
    .curl.prev .strip { transform-origin: right center; }
    .curl.next > .strip { left: 0; }
    .curl.prev > .strip { right: 0; left: auto; }
    .curl.next .strip .strip { left: 100%; transform: rotateY(var(--td, 0deg)); }
    .curl.prev .strip .strip { right: 100%; transform: rotateY(calc(-1 * var(--td, 0deg))); }

    .face {
      position: absolute;
      top: 0; bottom: 0; left: 0; right: -1.2px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-repeat: no-repeat;
      background-size: var(--bw, 0px) 100%;
    }
    .face.back { transform: rotateY(180deg); }

    .face .sh, .face .gl {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .curl.next .face.front .sh, .curl.prev .face.back .sh {
      background: linear-gradient(90deg, rgba(16,42,84,var(--a1,0)), rgba(16,42,84,var(--a2,0)));
    }
    .curl.next .face.back .sh, .curl.prev .face.front .sh {
      background: linear-gradient(90deg, rgba(16,42,84,var(--a2,0)), rgba(16,42,84,var(--a1,0)));
    }
    .face .gl {
      background: #ffffff;
      opacity: calc(var(--shade, 0) * var(--lit, 1) * var(--lit, 1) * 0.20);
    }

    /* Hit zones for Left/Right Page Flipping */
    .sb-zone {
      position: absolute;
      top: 0; bottom: 0;
      width: 50%;
      border: 0;
      background: transparent;
      z-index: 50;
      cursor: pointer;
    }
    .sb-zone.sb-prev {
      left: 0;
      cursor: pointer;
    }
    .sb-zone.sb-next {
      right: 0;
      cursor: pointer;
    }
    .sb-zone:active { cursor: grabbing; }

    /* ---------------- Snug Nav Arrows (Anchored on book edges) ---------------- */
    .arrow-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(16, 42, 84, 0.18);
      box-shadow: 0 6px 18px rgba(10, 31, 61, 0.24);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 85;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      color: var(--huxen-blue);
    }
    .arrow-btn:hover:not(:disabled) {
      background: #005bac;
      color: #ffffff;
      transform: translateY(-50%) scale(1.12);
      box-shadow: 0 8px 24px rgba(0, 91, 172, 0.38);
    }
    .arrow-btn:disabled {
      opacity: 0.22;
      cursor: not-allowed;
      box-shadow: none;
    }
    .arrow-btn.left { left: -24px; }
    .arrow-btn.right { right: -24px; }
    .arrow-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.6; }

    /* ---------------- Single Page High-Definition Mode (重構全幅大圖閱讀，支援 5x 縮放) ---------------- */
    .view-mode-single {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
      overflow: auto;
      scroll-behavior: smooth;
      padding: 50px 0 80px 0;
    }

    .single-page-sheet {
      position: relative;
      margin: 0 auto 30px auto;
      width: var(--single-w, 980px);
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 16px 48px rgba(10, 31, 61, 0.28);
      transition: width 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
    }

    .single-page-img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* Single page side navigation buttons (Fixed on viewport) */
    .single-side-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(16, 42, 84, 0.2);
      box-shadow: 0 8px 24px rgba(10, 31, 61, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 90;
      color: var(--huxen-blue);
      transition: all 0.2s;
    }
    .single-side-btn:hover:not(:disabled) {
      background: #005bac;
      color: #fff;
      transform: translateY(-50%) scale(1.12);
      box-shadow: 0 10px 28px rgba(0, 91, 172, 0.4);
    }
    .single-side-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
    }
    .single-side-btn.left { left: 24px; }
    .single-side-btn.right { right: 24px; }
    .single-side-btn svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2.6; }

    /* Single Mode Floating Zoom Controller (支援至 5x 500%) */
    .single-zoom-pill {
      position: fixed;
      top: 66px;
      right: 20px;
      background: rgba(10, 31, 61, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 95;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    .pill-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      font-size: 13px;
      height: 26px;
      min-width: 26px;
      padding: 0 6px;
      border-radius: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .pill-btn:hover {
      background: #005bac;
      color: #fff;
    }
    .pill-btn.pill-text {
      font-size: 11.5px;
      padding: 0 9px;
    }
    .pill-btn.active {
      background: #005bac;
      color: #fff;
      font-weight: 600;
    }
    .pill-val {
      font-size: 12px;
      color: #38bdf8;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .pill-sep {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 2px;
    }

    /* Zoom Focus Floating Badge (3D 雙擊/滾輪放大指示) */
    .focus-badge {
      position: absolute;
      top: 112px;
      background: rgba(10, 31, 61, 0.94);
      backdrop-filter: blur(8px);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      z-index: 95;
      display: none;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
      transition: transform 0.2s;
    }
    .focus-badge:hover {
      transform: scale(1.05);
      background: #005bac;
      color: #fff;
    }
    .focus-badge.show { display: flex; }

    /* ---------------- Bottom Footer (Rock-Solid CSS Grid 鎖定位置) ---------------- */
    .footer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 56px;
      background: rgba(10, 31, 61, 0.96);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      display: grid;
      grid-template-columns: 280px 220px 1fr 280px;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 100;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    }

    /* Col 1: Fixed 280px */
    .spread-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      overflow: hidden;
    }
    .contract-badge {
      background: #005bac;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .spread-caption {
      font-size: 13px;
      font-weight: 500;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    /* Col 2: Category Buttons Container - Strictly Fixed 220px (位置絕不跑位) */
    .category-group {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 220px;
      flex-shrink: 0;
    }
    .category-group .category-btn {
      width: 104px;

    /* ---------------- Drawer ---------------- */
    .drawer-overlay {

      pointer-events: none;

    .drawer {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      width: min(400px, 86vw);
      background: #ffffff;
      color: #0f172a;
      z-index: 310;

    .drawer-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      list-style: none;
    }

    .drawer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      margin-bottom: 4px;

    .drawer-thumb {
      width: 58px;
      height: 41px;
      border-radius: 4px;

    .drawer-info { flex: 1; overflow: hidden; }
    .drawer-item-title {
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .drawer-item-sub {
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
      white-space: nowrap;

    /* Loading overlay */
    .loading-overlay {

      inset: 0;
      background: rgba(10, 31, 61, 0.96);
      z-index: 999;

      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: opacity 0.4s;
    }
    .loading-overlay.fade { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;

      margin-bottom: 14px;

    .share-toast {
      position: fixed;
      top: 70px;
      left: 50%;

      background: rgba(2, 132, 199, 0.96);

      color: #fff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;

      pointer-events: none;

      display: flex;
      align-items: center;
      gap: 8px;
    }
    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    /* Footer structural containers */
    .footer-row-meta { display: contents; }
    .footer-row-controls { display: contents; }
    .mobile-page-readout { display: none; }

    @media (max-width: 1080px) {
      .header-search { display: none; }

    }

    @media (max-width: 768px) {

        font-size: 11.5px;
      }
      .nav-btn {
        height: 28px;
        padding: 0 8px;
      }
      .share-btn-text {
        display: none;

      /* Mobile Quick Guide */

      /* Mobile 2-tier Adaptive Footer (完美適應手機窄螢幕，絕不破版) */
      .footer {

      { spread: 3, page: 6, title: '影印機租賃 (LP5-114034)' },
      { spread: 5, page: 10, title: '二手影印機租賃 (LP5-114035)' },
      { spread: 8, page: 16, title: '電腦週邊設備用品 (LP5-114021)' },
      { spread: 11, page: 22, title: '傳真機及影印機耗材 (LP5-115006)' },
      { spread: 12, page: 24, title: '辦公用紙 (LP5-115009)' },
      { spread: 13, page: 26, title: '印刷機原廠油墨版紙 (LP5-115008)' },
      { spread: 14, page: 28, title: '印表機原廠耗材 (LP5-114051)' },
      { spread: 28, page: 56, title: '封底服務據點' }
    ];

    const wrap = document.getElementById('sbWrap');
    const stage = document.getElementById('sbStage');
    const sb3d = document.getElementById('sb3d');
    const sbTilt = document.getElementById('sbTilt');
    const book = document.getElementById('sbBook');
    const focusBadge = document.getElementById('focusBadge');

    const viewModeSpread = document.getElementById('viewModeSpread');
    const viewModeSingle = document.getElementById('viewModeSingle');
    const singlePageSheet = document.getElementById('singlePageSheet');
    const singlePageImg = document.getElementById('singlePageImg');

    const segSpreadBtn = document.getElementById('segSpreadBtn');
    const segSingleBtn = document.getElementById('segSingleBtn');

    let isSingleMode = false;
    let singlePageIdx = 1; // 1 to 57
    let singleWidth = 980; // default comfortable width in pixels (1x)

    const N = 18;
    const SPAN = 0.50;
    const BETA = 0.56;
    let idx = 0, turn = null;
    let strips = [];

    // Focus Zoom State (3D Mode)
    let isFocused = false;

    function el(t, c) {
      const e = document.createElement(t);
      if (c) e.className = c;
      return e;
    }

    function halfEl(pos, i) {
      const d = el('div', 'sb-half ' + pos);
      const im = new Image();
      im.className = 'sb-half-img ' + pos;
      im.src = PAGES[i].url;
      im.draggable = false;
      d.appendChild(im);
      d.appendChild(el('div', 'gutter-shade ' + pos));
      return d;
    }

    function buildCurl(dir, from, to) {
      strips = [];
      const c = el('div', 'curl ' + dir);
      c.style.setProperty('--n', N);
      c.style.setProperty('--span', SPAN);
      let host = c;

      for (let i = 0; i < N; i++) {
        const s = el('div', 'strip');
        s.style.setProperty('--i', i);

        const gut = 'calc(var(--bw) * 0.5)';
        const sw = 'calc(var(--bw) * ' + SPAN + ' / ' + N + ')';
        const A = 'calc(-1 * (' + gut + ' + ' + i + ' * ' + sw + '))';
        const B = 'calc(' + (i + 1) + ' * ' + sw + ' - ' + gut + ')';

        const f = el('div', 'face front');
        const b = el('div', 'face back');

        f.style.backgroundImage = 'url(' + PAGES[from].url + ')';
        f.style.backgroundPositionX = dir === 'next' ? A : B;

        b.style.backgroundImage = 'url(' + PAGES[to].url + ')';
        b.style.backgroundPositionX = dir === 'next' ? B : A;

        f.innerHTML = '<div class="sh"></div><div class="gl"></div>';
        b.innerHTML = '<div class="sh"></div><div class="gl"></div>';

        s.appendChild(f);
        s.appendChild(b);
        host.appendChild(s);
        host = s;
        strips.push(s);
      }
      return c;
    }

    function applyTurn(t) {
      const th = Math.PI * t;
      const beta = BETA * Math.sin(Math.PI * t);
      const D = 180 / Math.PI;
      const tt = th + beta, td = 2 * beta / N;

      sb3d.style.setProperty('--tt', (tt * D).toFixed(2) + 'deg');
      sb3d.style.setProperty('--td', (td * D).toFixed(3) + 'deg');
      sb3d.style.setProperty('--shade', Math.sin(Math.PI * t).toFixed(3));

      for (let i = 0; i < strips.length; i++) {
        const l1 = Math.abs(Math.cos(tt - i * td));
        const l2 = Math.abs(Math.cos(tt - (i + 1) * td));
        const st = strips[i].style;
        st.setProperty('--lit', l1.toFixed(3));
        st.setProperty('--a1', ((1 - l1) * 0.58).toFixed(3));
        st.setProperty('--a2', ((1 - l2) * 0.58).toFixed(3));
      }
    }

    function layout() {
      sb3d.style.setProperty('--bw', book.clientWidth + 'px');
    }

    function paint() {
      book.textContent = '';

      // 首頁單面模式判定 (當在第 0 頁且非翻頁中時，採用單面置中封面)
      if (idx === 0 && !turn) {
        sb3d.classList.add('is-cover');
      } else {
        sb3d.classList.remove('is-cover');
      }
      layout();

      if (!turn) {
        const f = el('div', 'sb-full' + (idx === 0 ? ' is-cover' : ''));
        const im = new Image();
        // 封面直接採用最高畫質單頁封面，絕對沒有任何多餘的藍色區塊！
        im.src = idx === 0 ? 'pages/page_01.webp' : PAGES[idx].url;
        im.draggable = false;
        f.appendChild(im);
        book.appendChild(f);
        sb3d.style.setProperty('--shade', '0');
      } else {
        const next = turn.dir === 'next';
        book.appendChild(halfEl('left', next ? turn.from : turn.to));
        book.appendChild(halfEl('right', next ? turn.to : turn.from));
        book.appendChild(buildCurl(turn.dir, turn.from, turn.to));
        applyTurn(turn.t);
      }

      // 點擊判定區：封面整面點擊即可翻開，內頁左右分開點擊
      if (idx === 0 && !turn) {
        const b = el('button', 'sb-zone is-cover-zone');
        b.style.cssText = 'position:absolute; inset:0; width:100%; border:0; background:transparent; cursor:pointer; z-index:50;';
        b.title = "👉 點擊翻開型錄 (前往第 2-3 頁)";
        book.appendChild(b);
      } else {
        const a = el('button', 'sb-zone sb-prev');
        a.title = idx > 0 ? "點擊翻至上一頁 (👈 左頁)" : "";
        const b = el('button', 'sb-zone sb-next');
        b.title = idx < M - 1 ? "點擊翻至下一頁 (👉 右頁)" : "";
        book.appendChild(a);
        book.appendChild(b);
      }

      updateMeta();
    }
    window.addEventListener('resize', () => { layout(); });

    /* ---------------- Spring Physics Engine ---------------- */
    let spring = null, raf = null, last = 0;
    function kick() {
      if (raf === null) {
        last = performance.now();
        raf = requestAnimationFrame(tick);
      }
    }

    function animateTo(target, onDone, stiff = 175, damp = 25) {
      spring = { kind: 'spring', v: 0, target, done: onDone, k: stiff, c: damp };
      kick();
    }

    function tick(now) {
      raf = null;
      const dt = Math.min(0.032, (now - last) / 1000 || 0.016);
      last = now;

      if (spring && turn) {
        const s = spring;
        const x = turn.t - s.target;
        s.v += (-s.k * x - s.c * s.v) * dt;
        turn.t += s.v * dt;
        if (Math.abs(turn.t - s.target) < 0.002 && Math.abs(s.v) < 0.02) {
          turn.t = s.target;
          spring = null;
          applyTurn(turn.t);
          if (s.done) s.done();
        } else {
          applyTurn(turn.t);
          kick();
        }
      }

      if (viewEase()) kick();
    }

    function startTurn(dir, t0) {
      if (turn) return false;
      const next = dir === 'next';
      if (next && idx >= M - 1) return false;
      if (!next && idx <= 0) return false;

      // 翻頁時立即恢復雙頁滿版尺寸
      sb3d.classList.remove('is-cover');

      turn = { dir, from: idx, to: next ? idx + 1 : idx - 1, t: t0 };
      paint();
      return true;
    }

    function commit() {
      if (!turn) return;
      animateTo(1, () => {
        idx = turn.to;
        turn = null;
        paint();
      }, 210, 26);
    }

    function cancel() {
      if (!turn) return;
      animateTo(0, () => {
        turn = null;
        paint();
      }, 210, 26);
    }

    function step(dir) {
      if (turn) return;
      if (dir === 'prev' && idx <= 0) return;
      if (dir === 'next' && idx >= M - 1) return;
      if (startTurn(dir, 0)) commit();
    }

    function goTo(targetIdx) {
      if (turn || targetIdx === idx || targetIdx < 0 || targetIdx >= M) return;
      const dir = targetIdx > idx ? 'next' : 'prev';
      sb3d.classList.remove('is-cover');
      turn = { dir, from: idx, to: targetIdx, t: 0 };
      paint();
      commit();
    }

    /* ---------------- Viewport Tilt & Pan Engine (支援 5.0x 縮放) ---------------- */
    const TILT_X = 5.0, TILT_Y = 8.0;
    const view = { rx: 0, ry: 0, z: 1, panX: 0, panY: 0, trx: 0, try_: 0, tz: 1, tPanX: 0, tPanY: 0 };
    let viewActive = false;

    function applyView() {
      sbTilt.style.setProperty('--rx', view.rx.toFixed(2) + 'deg');
      sbTilt.style.setProperty('--ry', view.ry.toFixed(2) + 'deg');
      sbTilt.style.setProperty('--zoom', view.z.toFixed(4));
      sbTilt.style.setProperty('--pan-x', view.panX.toFixed(1) + 'px');
      sbTilt.style.setProperty('--pan-y', view.panY.toFixed(1) + 'px');
    }

    function viewEase() {
      if (!viewActive) return false;
      let moved = false;
      const keys = ['rx', 'ry', 'z', 'panX', 'panY'];
      const targets = ['trx', 'try_', 'tz', 'tPanX', 'tPanY'];
      const speeds = [0.18, 0.18, 0.20, 0.20, 0.20];

      for (let i = 0; i < keys.length; i++) {
        const k = keys[i], t = targets[i];
        const diff = view[t] - view[k];
        if (Math.abs(diff) > 0.001) {
          view[k] += diff * speeds[i];
          moved = true;
        } else {
          view[k] = view[t];
        }
      }
      if (moved) applyView();
      viewActive = moved;
      return moved;
    }

    function tiltTo(cx, cy) {
      if (drag || isFocused) return;
      const r = book.getBoundingClientRect();
      if (!r.width) return;
      const nx = Math.max(-1, Math.min(1, (cx - (r.left + r.width / 2)) / (r.width * 0.6)));
      const ny = Math.max(-1, Math.min(1, (cy - (r.top + r.height / 2)) / (r.height * 0.85)));
      view.trx = -ny * TILT_X;
      view.try_ = nx * TILT_Y;
      viewActive = true;
      kick();
    }

    window.addEventListener('pointermove', e => {
      if (e.pointerType === 'touch' || isFocused) return;
      tiltTo(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('pointerout', e => {
      if (!e.relatedTarget && !isFocused) {
        view.trx = 0; view.try_ = 0;
        viewActive = true; kick();
      }
    });

    /* ---------------- Tap-to-Zoom & Wheel Zoom (支援至 5.0x / 500%) ---------------- */
    function zoomFocusPage(side) {
      isFocused = true;
      view.tz = 2.8; // 2.8x 聚焦
      view.trx = 0;
      view.try_ = 0;
      const bw = book.clientWidth;
      view.tPanX = side === 'left' ? bw * 0.38 : -bw * 0.38;
      view.tPanY = 0;
      viewActive = true;
      kick();
      focusBadge.innerHTML = '<span>🔍 已聚焦放大 2.8x (最高可滾輪放大至 5x) · 拖曳可平移 · 雙擊還原 (Esc)</span> ✕';
      focusBadge.classList.add('show');
    }

    function resetFocus() {
      isFocused = false;
      view.tz = 1.0;
      view.tPanX = 0;
      view.tPanY = 0;
      view.trx = 0;
      view.try_ = 0;
      viewActive = true;
      kick();
      focusBadge.classList.remove('show');
    }

    focusBadge.onclick = resetFocus;

    stage.addEventListener('dblclick', e => {
      if (isSingleMode) return;
      if (isFocused) {
        resetFocus();
        return;
      }
      const r = book.getBoundingClientRect();
      const isRight = (e.clientX - r.left) / r.width > 0.5;
      zoomFocusPage(isRight ? 'right' : 'left');
    });

    // 3D 雙頁模式滑鼠滾輪放大 (支援至 5.0x / 500%)
    stage.addEventListener('wheel', e => {
      if (isSingleMode) return;
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.35 : -0.35;
      const nextZ = Math.max(1.0, Math.min(5.0, view.tz + delta));
      if (nextZ !== view.tz) {
        view.tz = nextZ;
        if (view.tz <= 1.02) {
          resetFocus();
        } else {
          isFocused = true;
          focusBadge.innerHTML = `<span>🔍 已放大 ${Math.round(view.tz * 100)}% (最高支援 500%) · 拖曳可平移 · 雙擊還原 (Esc)</span> ✕`;
          focusBadge.classList.add('show');
          view.trx = 0; view.try_ = 0;
        }
        viewActive = true;
        kick();
      }
    }, { passive: false });

    /* ---------------- 點擊左右頁翻頁 & 拖曳 (嚴密分離點擊與拖曳) ---------------- */
    let drag = null;
    let pointerStart = null;

    stage.addEventListener('pointerdown', e => {
      if (e.button !== 0 || e.target.closest('.arrow-btn')) return;
      const zone = e.target.closest('.sb-zone');
      if (!zone && !e.target.closest('.sb-3d')) return;

      const r = book.getBoundingClientRect();
      const isRight = (e.clientX - r.left) / r.width > 0.5;
      const dir = isRight ? 'next' : 'prev';

      pointerStart = {
        x: e.clientX,
        y: e.clientY,
        time: performance.now(),
        isRight
      };

      stage.setPointerCapture(e.pointerId);

      drag = { dir, isRight, x0: e.clientX, y0: e.clientY, w: r.width, moved: 0, vel: 0, tPrev: performance.now(), started: false };
    });

    stage.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x0;
      const dy = e.clientY - drag.y0;
      drag.moved = Math.hypot(dx, dy);

      // Panning when zoomed in
      if (isFocused && drag.moved >= 5 && !drag.started) {
        view.tPanX += dx * 0.45;
        view.tPanY += dy * 0.45;
        drag.x0 = e.clientX;
        drag.y0 = e.clientY;
        viewActive = true;
        kick();
        return;
      }

      // Only enter 3D curl drag once moved more than threshold
      if (!drag.started && drag.moved >= 9 && !isFocused) {
        if (drag.dir === 'prev' && idx <= 0) return;
        if (drag.dir === 'next' && idx >= M - 1) return;

        if (startTurn(drag.dir, 0)) {
          drag.started = true;
        }
      }

      if (drag.started && turn) {
        const raw = (drag.dir === 'next' ? -dx : dx) / (drag.w * 0.55);
        const t = Math.max(0, Math.min(1, raw));
        const now = performance.now();
        drag.vel = (t - turn.t) / Math.max(0.001, (now - drag.tPrev) / 1000);
        drag.tPrev = now;

        turn.t = t;
        applyTurn(t);
      }
    });

    function handlePointerUp(e) {
      if (!pointerStart) return;
      const p = pointerStart; pointerStart = null;
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      const dist = Math.hypot(dx, dy);
      const elapsed = performance.now() - p.time;

      // 純點擊判定 (移動小於 9px 且在 450ms 內釋放)：100% 觸發點擊左右翻頁！
      if (dist < 9 && elapsed < 450) {
        drag = null;
        if (turn) return;

        // 如果在封面點擊，直接翻開前往第 2-3 頁
        if (idx === 0) {
          step('next');
          return;
        }

        if (p.isRight) {
          step('next');
        } else {
          step('prev');
        }
        return;
      }

      // 拖曳結束結算
      if (!drag) return;
      const d = drag; drag = null;
      if (!turn) return;
      const go = turn.t > 0.40 || d.vel > 1.0;
      if (go) commit(); else cancel();
    }

    stage.addEventListener('pointerup', handlePointerUp);
    stage.addEventListener('pointercancel', handlePointerUp);

    /* ---------------- Single Page Mode (高清巨幅閱讀重構，支援至 5x / 500%) ---------------- */
    const zoomPercent = document.getElementById('zoomPercent');
    const btnFitWidth = document.getElementById('btnFitWidth');
    const btnFitPage = document.getElementById('btnFitPage');
    const btnZoomHuge = document.getElementById('btnZoomHuge');
    const btnZoomMax = document.getElementById('btnZoomMax');
    const btnWheelMode = document.getElementById('btnWheelMode');
    let wheelMode = 'zoom'; // 預設直接推動滾輪放大縮小！

    function applySingleWidth(w, modeLabel) {
      // 支援至 4900px (5x / 500%)
      singleWidth = Math.max(600, Math.min(4900, Math.round(w)));
      singlePageSheet.style.setProperty('--single-w', singleWidth + 'px');
      const pct = Math.round((singleWidth / 980) * 100);
      zoomPercent.textContent = modeLabel || `${pct}% (${singleWidth}px)`;
      btnFitWidth.classList.toggle('active', singleWidth === 980);
      btnZoomHuge.classList.toggle('active', singleWidth === 2450);
      btnZoomMax.classList.toggle('active', singleWidth >= 4800);
      btnFitPage.classList.toggle('active', modeLabel === '整頁');
    }

    function setSinglePage(pageNumber) {
      singlePageIdx = Math.max(1, Math.min(TOTAL_PAGES, pageNumber));
      singlePageImg.src = `pages/page_${String(singlePageIdx).padStart(2, '0')}.webp`;

      // Reset scroll to top
      viewModeSingle.scrollTop = 0;

      // Map to corresponding spread
      idx = singlePageIdx === 1 ? 0 : Math.floor((singlePageIdx) / 2);
      updateMeta();

      document.getElementById('singleSidePrevBtn').disabled = singlePageIdx <= 1;
      document.getElementById('singleSideNextBtn').disabled = singlePageIdx >= TOTAL_PAGES;
    }

    document.getElementById('btnZoomIn').onclick = () => {
      applySingleWidth(singleWidth + 160);
    };
    document.getElementById('btnZoomOut').onclick = () => {
      applySingleWidth(singleWidth - 160);
    };
    btnFitWidth.onclick = () => applySingleWidth(980, '100% (980px)');
    btnZoomHuge.onclick = () => applySingleWidth(2450, '250% (2450px)');
    btnZoomMax.onclick = () => applySingleWidth(4900, '500% (5x 極限)');
    btnFitPage.onclick = () => {
      const availableH = viewModeSingle.clientHeight - 80;
      const fitW = Math.round(availableH * (595.28 / 841.89));
      applySingleWidth(fitW, '整頁');
    };

    btnWheelMode.onclick = () => {
      wheelMode = wheelMode === 'zoom' ? 'scroll' : 'zoom';
      btnWheelMode.classList.toggle('active', wheelMode === 'zoom');
      btnWheelMode.innerHTML = wheelMode === 'zoom' ? '🖱️ 滾輪縮放' : '🖱️ 滾輪捲動';
      btnWheelMode.title = wheelMode === 'zoom' ? '當前：直接推動滾輪即可縮放 (點擊切換為捲動)' : '當前：滾輪捲動頁面 (點擊切換為縮放，亦可隨時按住 Ctrl 縮放)';
    };

    // 單頁模式滑鼠滾輪縮放 (支援至 5x / 500%)
    viewModeSingle.addEventListener('wheel', e => {
      if (wheelMode === 'zoom' || e.ctrlKey) {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 140 : -140;
        applySingleWidth(singleWidth + delta);
      }
    }, { passive: false });

    // Single page side buttons
    document.getElementById('singleSidePrevBtn').onclick = () => setSinglePage(singlePageIdx - 1);
    document.getElementById('singleSideNextBtn').onclick = () => setSinglePage(singlePageIdx + 1);

    // 單頁模式點擊左頁翻上一頁、點擊右頁翻下一頁
    singlePageSheet.onclick = e => {
      const r = singlePageSheet.getBoundingClientRect();
      const isRight = (e.clientX - r.left) / r.width > 0.5;
      if (isRight) {
        setSinglePage(singlePageIdx + 1);
      } else {
        setSinglePage(singlePageIdx - 1);
      }
    };

    singlePageSheet.addEventListener('mousemove', e => {
      const r = singlePageSheet.getBoundingClientRect();
      const isRight = (e.clientX - r.left) / r.width > 0.5;
      singlePageSheet.style.cursor = 'pointer';
      singlePageSheet.title = isRight ? '👉 點擊翻至下一頁' : '👈 點擊翻至上一頁';
    });

    /* ---------------- View Mode Switcher (Segmented Control) ---------------- */
    function switchToSpread() {
      if (!isSingleMode) return;
      isSingleMode = false;
      segSpreadBtn.classList.add('active');
      segSingleBtn.classList.remove('active');
      viewModeSpread.style.display = 'flex';
      viewModeSingle.style.display = 'none';
      paint();
    }

    function switchToSingle() {
      if (isSingleMode) return;
      isSingleMode = true;
      segSingleBtn.classList.add('active');
      segSpreadBtn.classList.remove('active');
      viewModeSpread.style.display = 'none';
      viewModeSingle.style.display = 'flex';
      const targetPage = PAGES[idx].pages[0];
      setSinglePage(targetPage);
    }

    segSpreadBtn.onclick = switchToSpread;
    segSingleBtn.onclick = switchToSingle;

    /* ---------------- Category Navigation (嚴格固定螢幕位置) ---------------- */
    const prevCategoryBtn = document.getElementById('prevCategoryBtn');
    const nextCategoryBtn = document.getElementById('nextCategoryBtn');

    function getAdjacentCategories() {
      const currentSpread = isSingleMode ? (singlePageIdx === 1 ? 0 : Math.floor(singlePageIdx / 2)) : idx;
      let prevCat = null;
      let nextCat = null;

      for (let i = CATEGORIES.length - 1; i >= 0; i--) {
        if (CATEGORIES[i].spread < currentSpread) {
          prevCat = CATEGORIES[i];
          break;
        }
      }

      for (let i = 0; i < CATEGORIES.length; i++) {
        if (CATEGORIES[i].spread > currentSpread) {
          nextCat = CATEGORIES[i];
          break;
        }
      }
      return { prevCat, nextCat };
    }

    prevCategoryBtn.onclick = () => {
      const { prevCat } = getAdjacentCategories();
      if (prevCat) {
        if (isSingleMode) {
          setSinglePage(prevCat.page);
        } else {
          goTo(prevCat.spread);
        }
      }
    };

    nextCategoryBtn.onclick = () => {
      const { nextCat } = getAdjacentCategories();
      if (nextCat) {
        if (isSingleMode) {
          setSinglePage(nextCat.page);
        } else {
          goTo(nextCat.spread);
        }
      }
    };

    /* ---------------- Controls & Meta ---------------- */
    const contractBadge = document.getElementById('contractBadge');
    const spreadCaption = document.getElementById('spreadCaption');
    const scrubber = document.getElementById('scrubber');
    const pageReadout = document.getElementById('pageReadout');
    const mobilePageReadout = document.getElementById('mobilePageReadout');
    const sbLeft = document.getElementById('sbLeft');
    const sbRight = document.getElementById('sbRight');
    const prevPageBtn = document.getElementById('prevPageBtn');
    const nextPageBtn = document.getElementById('nextPageBtn');

    function updateMeta() {
      const currentIdx = turn ? turn.to : idx;
      const cur = PAGES[currentIdx];
      contractBadge.textContent = cur.contract || cur.category;
      spreadCaption.textContent = cur.title + ' — ' + cur.summary;

      if (isSingleMode) {
        scrubber.min = 1;
        scrubber.max = TOTAL_PAGES;
        scrubber.value = singlePageIdx;
        const pText = `P. ${singlePageIdx} / 57`;
        pageReadout.textContent = pText;
        if (mobilePageReadout) mobilePageReadout.textContent = pText;
        prevPageBtn.disabled = singlePageIdx <= 1;
        nextPageBtn.disabled = singlePageIdx >= TOTAL_PAGES;
      } else {
        scrubber.min = 0;
        scrubber.max = M - 1;
        scrubber.value = currentIdx;
        const pText = cur.pages.length === 1 ? `P. ${cur.pages[0]} / 57` : `P. ${cur.pages[0]}-${cur.pages[1]} / 57`;
        pageReadout.textContent = pText;
        if (mobilePageReadout) mobilePageReadout.textContent = pText;
        sbLeft.disabled = currentIdx <= 0;
        prevPageBtn.disabled = currentIdx <= 0;
        sbRight.disabled = currentIdx >= M - 1;
        nextPageBtn.disabled = currentIdx >= M - 1;
      }

      // Update category button titles & state
      const { prevCat, nextCat } = getAdjacentCategories();
      prevCategoryBtn.disabled = !prevCat;
      nextCategoryBtn.disabled = !nextCat;
      if (prevCat) prevCategoryBtn.title = `跳至上個類別：${prevCat.title}`;
      if (nextCat) nextCategoryBtn.title = `跳至下個類別：${nextCat.title}`;

      document.querySelectorAll('.drawer-item').forEach((item, i) => {
        item.classList.toggle('active', i === currentIdx);
      });

      if (typeof syncUrlHash === 'function') {
        syncUrlHash();
      }
    }

    scrubber.oninput = e => {
      const s = parseInt(e.target.value, 10);
      if (isSingleMode) {
        setSinglePage(s);
      } else {
        goTo(s);
      }
    };

    function goPrev() {
      if (isSingleMode) setSinglePage(singlePageIdx - 1);
      else step('prev');
    }

    function goNext() {
      if (isSingleMode) setSinglePage(singlePageIdx + 1);
      else step('next');
    }

    sbLeft.onclick = () => step('prev');
    sbRight.onclick = () => step('next');
    prevPageBtn.onclick = goPrev;
    nextPageBtn.onclick = goNext;
    document.getElementById('firstPageBtn').onclick = () => {
      if (isSingleMode) setSinglePage(1);
      else goTo(0);
    };
    document.getElementById('lastPageBtn').onclick = () => {
      if (isSingleMode) setSinglePage(TOTAL_PAGES);
      else goTo(M - 1);
    };

    document.getElementById('fullscreenBtn').onclick = () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    };

    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') goNext();
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') goPrev();
      if (e.key === 'Escape') {
        if (isFocused) resetFocus();
        if (isSingleMode) applySingleWidth(980, '100% (980px)');
      }
    });

    /* ---------------- Slide-out TOC Drawer ---------------- */
    const drawer = document.getElementById('drawer');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const drawerList = document.getElementById('drawerList');

    function toggleDrawer(open) {
      drawer.classList.toggle('open', open);
      drawerOverlay.classList.toggle('open', open);
    }

    document.getElementById('tocBtn').onclick = () => toggleDrawer(true);
    document.getElementById('closeDrawer').onclick = () => toggleDrawer(false);
    drawerOverlay.onclick = () => toggleDrawer(false);

    PAGES.forEach((p, i) => {
      const li = el('li', 'drawer-item' + (i === 0 ? ' active' : ''));
      const pLabel = p.pages.length === 1 ? `P. ${p.pages[0]}` : `P. ${p.pages[0]}-${p.pages[1]}`;
      const thumbUrl = i === 0 ? 'pages/page_01.webp' : p.url;
      li.innerHTML = `
        <img class="drawer-thumb" src="${thumbUrl}" alt="" loading="lazy">
        <div class="drawer-info">
          <div class="drawer-item-title">${p.title}</div>
          <div class="drawer-item-sub">${p.summary}</div>
          <div class="drawer-item-badge">${p.contract ? p.contract + ' · ' : ''}${pLabel}</div>
        </div>
      `;
      li.onclick = () => {
        if (isSingleMode) {
          setSinglePage(p.pages[0]);
        } else {
          goTo(i);
        }
        toggleDrawer(false);
      };
      drawerList.appendChild(li);
    });

    /* ---------------- Instant Search Filter ---------------- */
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');

    searchInput.addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        searchResults.classList.remove('open');
        return;
      }

      const matches = [];
      PAGES.forEach((p, i) => {
        const fullText = (p.title + ' ' + p.category + ' ' + p.contract + ' ' + p.summary + ' ' + p.search_text).toLowerCase();
        if (fullText.includes(q)) {
          const idx = fullText.indexOf(q);
          const start = Math.max(0, idx - 20);
          const snippet = '...' + fullText.substring(start, start + 65) + '...';
          matches.push({ index: i, page: p, snippet });
        }
      });

      if (matches.length > 0) {
        searchResults.innerHTML = '';
        matches.slice(0, 10).forEach(m => {
          const item = el('div', 'search-item');
          const pLabel = m.page.pages.length === 1 ? `第 ${m.page.pages[0]} 頁` : `第 ${m.page.pages[0]}-${m.page.pages[1]} 頁`;
          item.innerHTML = `
            <div class="search-item-header">
              <span class="search-item-title">${m.page.title} ${m.page.contract ? ' (' + m.page.contract + ')' : ''}</span>
              <span class="search-item-page">${pLabel}</span>
            </div>
            <div class="search-item-snippet">${m.snippet}</div>
          `;
          item.onclick = () => {
            if (isSingleMode) {
              setSinglePage(m.page.pages[0]);
            } else {
              goTo(m.index);
            }
            searchResults.classList.remove('open');
            searchInput.value = '';
          };
          searchResults.appendChild(item);
        });
        searchResults.classList.add('open');
      } else {
        searchResults.innerHTML = '<div style="padding:12px;color:#94a3b8;font-size:12px;text-align:center;">無相符項目</div>';
        searchResults.classList.add('open');
      }
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.header-search')) {
        searchResults.classList.remove('open');
      }
    });

    /* ---------------- URL Deep Linking & Share (網址帶頁碼直連與一鍵分享) ---------------- */
    const shareBtn = document.getElementById('shareBtn');
    const shareToast = document.getElementById('shareToast');

    function getShareUrl() {
      const curMode = isSingleMode ? 'single' : 'spread';
      let curPage = 1;
      if (isSingleMode) {
        curPage = singlePageIdx;
      } else {
        const cur = PAGES[idx];
        curPage = cur && cur.pages ? cur.pages[0] : 1;
      }
      return `${window.location.origin}${window.location.pathname}#page=${curPage}&mode=${curMode}`;
    }

    function showToast(msg) {
      if (!shareToast) return;
      shareToast.textContent = msg;
      shareToast.classList.add('show');
      setTimeout(() => shareToast.classList.remove('show'), 2200);
    }

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); if (cb) cb(); } catch (e) {}
      document.body.removeChild(ta);
    }

    if (shareBtn) {
      shareBtn.onclick = () => {
        const url = getShareUrl();
        const curPage = isSingleMode ? singlePageIdx : (PAGES[idx].pages[0] || 1);
        const msg = `🔗 已複製第 ${curPage} 頁專屬分享網址！`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(() => showToast(msg)).catch(() => fallbackCopy(url, () => showToast(msg)));
        } else {
          fallbackCopy(url, () => showToast(msg));
        }
      };
    }

    let hashSyncTimer = null;
    function syncUrlHash() {
      clearTimeout(hashSyncTimer);
      hashSyncTimer = setTimeout(() => {
        const curMode = isSingleMode ? 'single' : 'spread';
        let curPage = 1;
        if (isSingleMode) {
          curPage = singlePageIdx;
        } else {
          const cur = PAGES[idx];
          curPage = cur && cur.pages ? cur.pages[0] : 1;
        }
        const targetHash = `#page=${curPage}&mode=${curMode}`;
        if (window.location.hash !== targetHash) {
          history.replaceState(null, '', targetHash);
        }
      }, 120);
    }

    function parseHashRoute() {
      const raw = window.location.hash.replace(/^#/, '');
      if (!raw) return null;
      const parts = raw.split('&');
      let page = null;
      let mode = null;
      parts.forEach(p => {
        const [k, v] = p.split('=');
        if (k === 'page' || k === 'p') page = parseInt(v, 10);
        else if (k === 'mode') mode = v;
        else if (/^\d+$/.test(k)) page = parseInt(k, 10);
      });
      return { page, mode };
    }

    function applyHashRoute() {
      const r = parseHashRoute();
      if (!r) return false;

      if (r.mode === 'single' && !isSingleMode) {
        switchToSingle();
      } else if (r.mode === 'spread' && isSingleMode) {
        switchToSpread();
      }

      if (r.page && r.page >= 1 && r.page <= TOTAL_PAGES) {
        if (isSingleMode) {
          setSinglePage(r.page);
        } else {
          const targetSpread = r.page === 1 ? 0 : Math.floor(r.page / 2);
          if (targetSpread !== idx) goTo(targetSpread);
        }
        return true;
      }
      return false;
    }

    window.addEventListener('hashchange', applyHashRoute);

    /* ---------------- Mobile & Tablet Touch Swipe (手機與平板左右滑動手勢翻頁) ---------------- */
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = performance.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', e => {
      if (e.changedTouches.length !== 1) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const dt = performance.now() - touchStartTime;

      // 當單頁放大且寬度大於螢幕 (使用者正在平移檢視) 時，不觸發換頁
      if (isSingleMode && singleWidth > window.innerWidth * 1.12) return;

      // 明確的橫向滑動判定 (距離大於 44px，耗時小於 450ms，且橫向位移明顯大於縱向位移)
      if (dt < 450 && Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) {
          goNext(); // 向左滑動 -> 下一頁
        } else {
          goPrev(); // 向右滑動 -> 上一頁
        }
      }
    }, { passive: true });

    /* ---------------- Preload & Init (支援手機自動單頁 + URL 路由直連) ---------------- */
    async function init() {
      const isMobileDevice = window.innerWidth <= 768;
      const route = parseHashRoute();

      if (route && route.page) {
        if (route.mode === 'single' || (!route.mode && isMobileDevice)) {
          switchToSingle();
          setSinglePage(route.page);
        } else {
          const targetSpread = route.page === 1 ? 0 : Math.floor(route.page / 2);
          idx = targetSpread;
          paint();
          updateMeta();
        }
      } else if (isMobileDevice) {
        // 行動裝置預設直接開啟單頁大圖模式，兼顧最佳閱讀清晰度與流暢度
        singleWidth = Math.min(980, window.innerWidth - 16);
        switchToSingle();
      } else {
        paint();
        updateMeta();
      }

      // Pre-decode initial spreads
      try {
        const promises = [0, 1, 2].filter(i => i < M).map(i => {
          const img = new Image();
          img.src = PAGES[i].url;
          return img.decode().catch(() => {});
        });
        await Promise.all(promises);
      } catch (e) {}

      const overlay = document.getElementById('loadingOverlay');
      overlay.classList.add('fade');
      setTimeout(() => overlay.remove(), 450);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
